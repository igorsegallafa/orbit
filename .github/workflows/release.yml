name: Release

# Publishing a release on GitHub (tag v1.2.3) builds the app and attaches
# the installers and the updater's latest.json to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Apple Silicon. Ad-hoc signed (tauri.macos.conf.json): no Apple
          # Developer ID yet, so the first launch needs "Open Anyway";
          # updates install without it.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Tag runs can't see each other's caches, only main's: cache.yml keeps
      # one there under this key, and releases only read it.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: tauri-release
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      # The release tag is the source of truth for the version: v1.2.3 -> 1.2.3.
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
