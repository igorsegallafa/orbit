name: Release

# Publishing a release on GitHub (tag v1.2.3) builds Orbit (native/) for each
# OS, signs the downloads and attaches them with the updater's latest.json.
# The tag is the version: build.rs bakes ORBIT_VERSION into the binary.
# latest.json is at the URL and in the format the legacy Tauri Orbit checks,
# with the same platform keys, so its installs update themselves to this.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # A published release is "latest" at once, before its downloads exist, so the
  # updater's latest.json would 404 while building. Hold it as a pre-release
  # (skipped by "latest") until publish has uploaded everything.
  hold:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease --repo "${{ github.repository }}"

  build:
    needs: hold
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage, .deb, .rpm and a tarball. Built on the oldest supported
          # Ubuntu so the glibc it links runs on more distros.
          - os: linux
            runner: ubuntu-22.04
            features: ""
          # NSIS installer + a zip of Orbit.exe (the updater's download).
          - os: windows
            runner: windows-latest
            features: ""
          # Apple Silicon, ad-hoc signed (no Developer ID yet). Shaders are
          # compiled at run time: no Metal toolchain needed on the runner.
          - os: macos
            runner: macos-latest
            features: "--features gpui_platform/runtime_shaders"

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: echo "ORBIT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan-dev rpm

      - uses: dtolnay/rust-toolchain@stable

      # Tag runs can't see each other's caches, only main's: cache.yml keeps
      # one there under this key, and releases only read it.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: native-release-${{ matrix.os }}
          save-if: false

      - name: Build
        run: cargo build --release --locked -p orbit-native ${{ matrix.features }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" native/scripts/package-linux.sh --no-build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v makensis >/dev/null || [[ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]] || choco install nsis -y --no-progress
          native/scripts/package-windows.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: native/scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.os }}
          path: |
            native/dist/Orbit-*
          if-no-files-found: error

  # Signs every download with the updater key (the Tauri app's minisign key,
  # same secrets) and publishes them with latest.json. The manifest keeps the
  # Tauri updater's URL and format, so installed Tauri builds update to this.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "native/tools/sign -> target"
          shared-key: orbit-sign

      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-*
          path: out
          merge-multiple: true

      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo run --release --locked --manifest-path native/tools/sign/Cargo.toml -- "${GITHUB_REF_NAME#v}" out/Orbit-*

      - name: Write latest.json
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          native/scripts/release-manifest.sh "$GITHUB_REF_NAME" out \
            "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" "$NOTES" > out/latest.json
          cat out/latest.json

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "${{ github.repository }}"

      - name: Make it the latest release
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest --repo "${{ github.repository }}"
