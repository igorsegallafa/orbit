name: Build cache

# GitHub only lets a run restore caches from its own ref or the default
# branch, so a release (a new tag each time) never sees the previous one's.
# Building on main leaves a cache every release can start from.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-cache
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            features: ""
          - os: windows
            runner: windows-latest
            features: ""
          - os: macos
            runner: macos-latest
            features: "--features gpui_platform/runtime_shaders"

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./native -> target"
          shared-key: native-release-${{ matrix.os }}

      # Same release build the Release workflow runs, minus packaging and signing.
      - name: Build
        run: cargo build --release --locked ${{ matrix.features }}
