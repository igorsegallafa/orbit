[package]
name = "orbit-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Orbit's backend logic (no UI)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
shell-words = "1"
notify = "8"
ignore = "0.4"
trash = "5.2.9"
portable-pty = "0.9"
# Update signatures (minisign, as the Tauri updater) and their base64 wrapping.
minisign-verify = "0.2"
base64 = "0.22"

[target."cfg(windows)".dependencies]
winreg = "0.55"
